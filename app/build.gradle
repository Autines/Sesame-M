apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    def version = project.getProperties().get("version")
    if (version == null || "unspecified".equalsIgnoreCase(version)) {
        // 版本名固定为**上游最新发布版**，保证一眼看出本地构建基于上游哪一版；
        // 本地改动不进版本名，只体现在构建号（versionCode = git 提交数，每提交一次自动 +1）。
        // 上游的 CI 用 -Pversion=<tag> 覆盖，本地构建沿用这个默认值即可。
        version = "1.3.5"
    }
    project.ext.appVersion = version
    def gitCommitHash = "unknown"
    def gitBranchName = "unknown"
    def gitCommitCount = 1
    try {
        gitCommitHash = 'git rev-parse --short HEAD'.execute().text.trim()
        gitBranchName = 'git rev-parse --abbrev-ref HEAD'.execute().text.trim()
        gitCommitCount = "git rev-list --count HEAD".execute().text.trim().toInteger()
    } catch (Exception ignored) { }
    def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("Asia/Shanghai"))

    compileSdk 37
    namespace 'io.github.aw1y2z.sesame'
    defaultConfig {
        applicationId "io.github.aw1y2z.sesame"
        minSdk 26
        // 36 = Android 16。升到这个目标版本后系统启用「预测式返回」，
        // 不再调用 Activity.onBackPressed()，各页面已统一改走 OnBackPressedDispatcher。
        targetSdk 36
        // 构建号 = git 提交数 + 偏移。
        //
        // 为什么不能只用提交数：**提交数会回落** —— 一旦重建 / 压缩 git 历史
        // （比如把 5 个提交压成 1 个），`git rev-list --count HEAD` 立刻变小，
        // 新包的 versionCode 就比手机上已装的还低 → 系统直接拒装
        // （INSTALL_FAILED_VERSION_DOWNGRADE；而且 adb 的 -d 只对 debuggable 包生效，
        //  对 release 包无效，只能 root 兜底）。
        // 留一段偏移后，压缩历史不会再把构建号压到已装版本之下。
        // ⚠️ 将来若某次压缩幅度超过该偏移量，把 1000 调大即可（只需大于历史最大值）。
        versionCode gitCommitCount + 1000
        versionName version

        buildConfigField "String", "GIT_COMMIT_HASH", "\"${gitCommitHash}\""
        buildConfigField "String", "GIT_BRANCH_NAME", "\"${gitBranchName}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
    }
    buildFeatures {
        buildConfig = true // 显式启用 BuildConfig
        compose = true
    }
    ext {
        applicationName = "Sesame-M"
        applicationType = "Normal"
    }
    flavorDimensions.add("default")
    productFlavors {
        normal {
            dimension "default"
            ext.applicationType = "Normal"
        }
    }
    signingConfigs {
        // 本地 release 包的签名。
        //
        // 用 Android SDK 自带的 debug 密钥：和手机上一直安装的 debug 包是同一把钥匙，
        // 可以直接覆盖安装，LSPosed 里已授权的模块也不用重新配置。
        // （AGP 只会自动给 debug 构建类型签名，release 不配就是未签名包，装不上。）
        //
        // 上游 CI 不受影响：它在 gradle 构建完成后另外用 apksigner 签（见
        // .github/workflows/release.yml），用的是仓库 secrets 里的正式密钥。
        localRelease {
            storeFile file("${System.getProperty("user.home")}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.localRelease
        }
    }
    // 按 ABI 拆分 APK：仅发布 arm 主流架构，保留 universal 全架构兜底包
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }
    packaging {
        resources {
            merges += "META-INF/xposed/**"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        // 构建时间戳：产物名带上构建时刻，避免多次构建产出同名文件互相覆盖 / 分不清哪个最新。
        // ⚠️ 必须在 onVariants 回调内取时间（每次构建都会执行），不能提到脚本顶层 ——
        // 顶层求值会被 Gradle 配置缓存复用，时间戳会停留在首次配置的时刻。
        String buildStamp = new java.text.SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date())
        variant.outputs.forEach { output ->
            // 按 ABI 区分产物名：arm64-v8a / armeabi-v7a；无 ABI filter 的为 universal 兜底包
            String abiTag = "-universal"
            output.getFilters().forEach { f ->
                if (f.getFilterType().name() == 'ABI') {
                    abiTag = "-" + f.getIdentifier()
                }
            }
            output.outputFileName.set("Sesame-M-Normal${abiTag}-${project.appVersion}_${buildStamp}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.22.3'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.22.3'
    // annotations 走独立版本线：只有 2.22，没有 2.22.3，勿与 core/databind 对齐
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.22'

    // NanoHTTPD 核心依赖（最新稳定版）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Kotlin + Compose（miuix UI 重构基础）
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "top.yukonga.miuix.kmp:miuix-ui:0.9.4"
    implementation "top.yukonga.miuix.kmp:miuix-preference:0.9.4"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    // Material Design 3（界面风格可选：设置 → 界面风格 → Material Design 3）
    // ⚠️ 走 1.5.0-alpha 通道的原因：1.4.0 里 Expressive 相关 API（MaterialExpressiveTheme /
    // MotionScheme / ExperimentalMaterial3ExpressiveApi）**全部标为库 internal**、外部调不到
    // （实测编译报 "Cannot access ...: it is internal in file"）；alpha 通道已对外开放。
    // 代价是预发布版依赖，需要实机回归；若有问题，退回 1.4.0 即可（Expressive 自动失效）。
    implementation "androidx.compose.material3:material3:1.5.0-alpha22"
    // Compose Foundation Pager（HorizontalPager，底部 Tab 滑动切换）
    implementation "androidx.compose.foundation:foundation:1.7.6"

    // 液态玻璃（iOS 26 风折射悬浮底栏）。
    // 库选型过程：先用 NadeemIqbal/liquid-glass 0.2.3，实机像素实测证明它的模糊**完全不生效**
    // （背景 GraphicsLayer 录制为空 → 只剩 tint），已弃用并移除依赖。
    // 现用 Kyant0/Backdrop 2.0.1（Maven Central）：模糊 + 折射 + 色散 + 高光均实测生效。
    // 能力分级（读库源码 androidMain/Platform.kt）：模糊/阴影/高光需 API 31+，
    // 折射透镜（AGSL）需 API 33+；低于门槛时对应效果**静默跳过、不崩**（minSdk 26 安全）。
    implementation "io.github.kyant0:backdrop:2.0.1"
}
